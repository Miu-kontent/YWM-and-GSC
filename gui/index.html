<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YWM-and-GSC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран загрузки (оставлен без изменений) -->
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <p id="loader-status">Загрузка приложения...</p>
        <div id="loader-logs" class="logs-container"></div>
    </div>

    <!-- Диалог обновления -->
    <div id="version-overlay" class="hidden">
        <div class="card" style="margin: auto; max-width: 420px; text-align: center;">
            <h2 class="section__title">🆕 Новая версия доступна</h2>
            <p class="card__body" style="margin-bottom: 24px;">Версия <strong id="remote-ver"></strong> доступна на сервере.<br>Текущая версия: <strong id="local-ver"></strong></p>
            <div class="grid grid--2-cols">
                <button id="btn-update" class="btn btn--primary" onclick="doUpdate()">Обновить</button>
                <button id="btn-skip" class="btn btn--secondary" onclick="skipUpdate()">Пропустить</button>
            </div>
        </div>
    </div>

    <header class="header">
        <h1>YWM-and-GSC</h1>
        <!-- Используем универсальную навигацию -->
        <nav class="nav nav--horizontal" id="main-nav">
            <button class="nav__item active" data-tab="dashboard" onclick="switchTab('dashboard')">🏠 Главная</button>
            <button class="nav__item" data-tab="yandex" onclick="switchTab('yandex')">🌏 Яндекс</button>
            <button class="nav__item" data-tab="google" onclick="switchTab('google')">🔍 Google</button>
        </nav>
        <button class="btn--icon" onclick="toggleTheme()" title="Сменить тему">🌙</button>
    </header>

    <main class="container">
        <section id="tab-dashboard" class="tab-content">
            <!-- Универсальная секция вместо жесткого -->
            <section class="section">
                <h3 class="section__title">🔐 Ключи доступов</h3>
                
                <!-- Разделение на два подблока через Grid -->
                <div class="grid grid--2-cols">
                    
                    <!-- Блок Яндекс -->
                    <div class="card">
                        <div class="card__header">
                            <span class="card__icon">🌏</span> Яндекс
                            <button class="btn btn--primary" onclick="launchBrowser('yandex')">🌐 Браузер (порт 9229)</button>
                            <button class="btn btn--primary" onclick="saveKeys('yandex', event)">💾 Сохранить Яндекс</button>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                            <div class="form-group">
                                <label class="form-label">OAuth Token</label>
                                <input type="text" class="form-control" data-service="yandex" data-field="oauth_token" placeholder="y0_AgAAA...">
                            </div>
                            <button class="btn btn--primary btn--small" onclick="getYandexToken()">🔑 Получить</button>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                            <div class="form-group">
                                <label class="form-label">User ID</label>
                                <input type="text" class="form-control" data-service="yandex" data-field="user_id" placeholder="123456789">
                            </div>
                            <button class="btn btn--primary btn--small" onclick="getYandexUserId()">🔑 Получить</button>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                            <div class="form-group">
                                <label class="form-label">Счетчик метрики</label>
                                <input type="text" class="form-control" data-service="yandex" data-field="metric_id" placeholder="12345678">
                            </div>
                            <button class="btn btn--primary btn--small" onclick="getYandexMetricId()">🔑 Получить</button>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Страница контактов</label>
                            <input type="text" class="form-control" data-service="yandex" data-field="contact_path" placeholder="contacts">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Sitemap</label>
                            <input type="text" class="form-control" data-service="yandex" data-field="sitemap_path" placeholder="/sitemap/">
                        </div>
                    </div>

                    <!-- Блок Google -->
                    <div class="card">
                        <div class="card__header">
                            <span class="card__icon">🔍</span> Google
                            <button class="btn btn--primary" onclick="launchBrowser('google')">🌐 Браузер (порт 9227)</button>
                            <button class="btn btn--primary" onclick="saveKeys('google', event)">💾 Сохранить Google</button>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Client ID</label>
                            <input type="text" class="form-control" data-service="google" data-field="client_id" placeholder="xxx.apps.googleusercontent.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Client Secret</label>
                            <input type="text" class="form-control" data-service="google" data-field="client_secret" placeholder="GOCSPX-...">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Access Token</label>
                            <input type="text" class="form-control" data-service="google" data-field="access_token" placeholder="ya29.a0A...">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Auth Code</label>
                            <input type="text" class="form-control" data-service="google" data-field="auth_code" placeholder="4/0A... (одноразовый)">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Sitemap</label>
                            <input type="text" class="form-control" data-service="google" data-field="sitemap_path" placeholder="/sitemap/">
                        </div>
                    </div>
                </div>
            </section>
        </section>

        <!-- Вкладка Яндекс -->
        <section id="tab-yandex" class="tab-content hidden">
            <div class="accordion" id="yandex-keys-accordion">
                <div class="accordion__header" onclick="toggleAccordion('yandex-keys')">
                    <span>🔑 Ключи <span class="accordion__arrow">&#9660;</span></span>
                    <span class="accordion__title">🌏 Вебмастер & Метрика</span>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button class="btn btn--secondary btn--small" onclick="event.stopPropagation(); launchBrowser('yandex')">🌐 Браузер</button>
                        <button class="btn btn--primary btn--small" onclick="event.stopPropagation(); saveKeys('yandex', event)">💾 Сохранить</button>
                    </div>
                </div>
                <div class="accordion__body hidden" id="yandex-keys-body">
                    <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                        <div class="form-group">
                            <label class="form-label">OAuth Token</label>
                            <input type="text" class="form-control" data-service="yandex" data-field="oauth_token" placeholder="y0_AgAAA...">
                        </div>
                        <button class="btn btn--primary btn--small" onclick="getYandexToken()">🔑 Получить</button>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                        <div class="form-group">
                            <label class="form-label">User ID</label>
                            <input type="text" class="form-control" data-service="yandex" data-field="user_id" placeholder="123456789">
                        </div>
                        <button class="btn btn--primary btn--small" onclick="getYandexUserId()">🔑 Получить</button>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;">
                        <div class="form-group">
                            <label class="form-label">Счетчик метрики</label>
                            <input type="text" class="form-control" data-service="yandex" data-field="metric_id" placeholder="12345678">
                        </div>
                        <button class="btn btn--primary btn--small" onclick="getYandexMetricId()">🔑 Получить</button>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Страница контактов</label>
                        <input type="text" class="form-control" data-service="yandex" data-field="contact_path" placeholder="contacts">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sitemap</label>
                        <input type="text" class="form-control" data-service="yandex" data-field="sitemap_path" placeholder="/sitemap/">
                    </div>
                </div>
            </div>

            <!-- Навигация по категориям (генерируется из registry.json) -->
            <div class="category-nav" id="yandex-category-nav"></div>

            <!-- Контент активной подкатегории -->
            <div id="yandex-script-content"></div>
        </section>

        <!-- Вкладка Google -->
        <section id="tab-google" class="tab-content hidden">
            <div class="accordion" id="google-keys-accordion">
                <div class="accordion__header" onclick="toggleAccordion('google-keys')">
                    <span>🔑 Ключи <span class="accordion__arrow">&#9660;</span></span>
                    <span class="accordion__title">🔍 Google Search Console</span>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button class="btn btn--secondary btn--small" onclick="event.stopPropagation(); launchBrowser('google')">🌐 Браузер</button>
                        <button class="btn btn--primary btn--small" onclick="event.stopPropagation(); saveKeys('google', event)">💾 Сохранить</button>
                    </div>
                </div>
                <div class="accordion__body hidden" id="google-keys-body">
                    <div class="form-group">
                        <label class="form-label">Client ID</label>
                        <input type="text" class="form-control" data-service="google" data-field="client_id" placeholder="xxx.apps.googleusercontent.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Client Secret</label>
                        <input type="password" class="form-control" data-service="google" data-field="client_secret" placeholder="GOCSPX-...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Access Token</label>
                        <input type="password" class="form-control" data-service="google" data-field="access_token" placeholder="ya29.a0A...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Auth Code</label>
                        <input type="text" class="form-control" data-service="google" data-field="auth_code" placeholder="4/0A... (одноразовый)">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sitemap</label>
                        <input type="text" class="form-control" data-service="google" data-field="sitemap_path" placeholder="/sitemap/">
                    </div>
                </div>
            </div>

            <!-- Навигация по категориям (генерируется из registry.json) -->
            <div class="category-nav" id="google-category-nav"></div>

            <!-- Контент активной подкатегории -->
            <div id="google-script-content"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
